[project]
name = "prova-platform"
version = "1.0.0"
description = "بروفة: review platform for the signal 1064 detour (prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "anthropic==2.8.0",
    "uvicorn==0.54.0",
]

# Vercel: serve /static (scripts, styles, fonts, map library, sample file) from the CDN.
# The app's no-cache middleware only matters for local development.
[tool.vercel.fastapi.static]
cdn = true
